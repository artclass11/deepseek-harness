name: ChatGPT MCP bridge

on:
  pull_request:
    paths:
      - integrations/chatgpt-mcp/**
  push:
    branches:
      - master
    paths:
      - integrations/chatgpt-mcp/**

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/chatgpt-mcp/requirements.txt

      - name: Install bridge test dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/chatgpt-mcp/requirements.txt

      - name: Compile bridge, scripts, and tests
        run: python -m compileall -q integrations/chatgpt-mcp/src integrations/chatgpt-mcp/scripts integrations/chatgpt-mcp/tests

      - name: Run bridge unit tests
        run: python -m pytest -q integrations/chatgpt-mcp
